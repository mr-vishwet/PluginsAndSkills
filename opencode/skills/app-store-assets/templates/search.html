<!DOCTYPE html>
<!-- iOS Search Results Asset. Author at 1920x1280, render 2x -> resample to 3840x2560 (or 1920x1280).
     3:2 left-copy / right-hero layout. Place logo.png (and optional screenshot.jpg) next to this file. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    /* ==== EDIT to the target app's theme ==== */
    --brand:#705BE4; --brand-dark:#5A46C7; --accent1:#9B67F9; --accent2:#FC5F4A;
    --ink:#23204B; --muted:#5B6072; --bg1:#FBFAFF; --bg2:#F1EEFC; --bg3:#EAE4F9;
    --serif:'Playfair Display',Georgia,serif; --sans:'Inter',-apple-system,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1280px;overflow:hidden;}
  body{font-family:var(--sans);position:relative;-webkit-font-smoothing:antialiased;color:var(--ink);
    background:
      radial-gradient(1300px 1200px at 82% 36%, rgba(155,103,249,.20) 0%, rgba(155,103,249,0) 60%),
      radial-gradient(1000px 1000px at 2% 114%, rgba(112,91,228,.14) 0%, rgba(112,91,228,0) 60%),
      linear-gradient(120deg,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%);}
  .accent-bar{position:absolute;left:0;top:0;width:20px;height:1280px;
    background:linear-gradient(180deg,var(--accent1) 0%,var(--brand) 55%,var(--accent2) 100%);}
  .ring{position:absolute;border-radius:50%;border:3px solid rgba(112,91,228,.10);}
  .r1{width:760px;height:760px;right:-180px;top:-260px;}
  .r2{width:480px;height:480px;right:300px;bottom:-280px;border-color:rgba(252,95,74,.12);}
  .stage{position:relative;width:1920px;height:1280px;display:flex;align-items:center;justify-content:space-between;padding:0 120px 0 140px;}
  .copy{width:1000px;}
  .eyebrow{display:inline-flex;align-items:center;gap:16px;font-size:25px;font-weight:700;letter-spacing:4.5px;
    text-transform:uppercase;color:var(--brand-dark);margin-bottom:34px;}
  .eyebrow .dot{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--accent1),var(--accent2));}
  h1{font-family:var(--serif);font-weight:800;color:var(--ink);font-size:108px;line-height:1.06;letter-spacing:-1.5px;}
  h1 .hl{background:linear-gradient(120deg,var(--accent1),var(--brand) 55%,var(--accent2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{margin-top:38px;font-size:38px;line-height:1.46;color:var(--muted);max-width:960px;}
  .pills{display:flex;flex-wrap:wrap;gap:22px;margin-top:56px;max-width:1000px;}
  .pill{display:inline-flex;align-items:center;gap:14px;padding:20px 32px;border-radius:999px;font-size:29px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.75);border:3px solid rgba(112,91,228,.22);box-shadow:0 12px 30px rgba(90,70,199,.08);}
  .pill svg{width:32px;height:32px;}
  .hero{position:relative;width:640px;height:900px;}
  .hero .glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:620px;height:620px;border-radius:50%;
    background:radial-gradient(circle,rgba(155,103,249,.26) 0%,rgba(252,95,74,.08) 46%,rgba(0,0,0,0) 70%);filter:blur(20px);}
  .shot{position:absolute;z-index:1;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-7deg);width:460px;height:890px;border-radius:66px;
    overflow:hidden;background-color:#fff;opacity:.17;border:4px solid rgba(112,91,228,.18);background-image:url('screenshot.jpg');
    background-repeat:no-repeat;background-size:250% auto;background-position:50% 56%;box-shadow:0 46px 115px rgba(60,40,140,.16);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 84%,transparent 100%);
            mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 84%,transparent 100%);}
  .badge{position:absolute;z-index:3;width:400px;height:400px;border-radius:94px;overflow:hidden;left:50%;bottom:30px;
    transform:translateX(-50%) rotate(-4deg);border:6px solid rgba(255,255,255,.72);
    box-shadow:0 50px 115px rgba(60,40,140,.34),0 12px 30px rgba(60,40,140,.22);}
  .badge img{width:100%;height:100%;object-fit:cover;display:block;}
</style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="stage">
    <div class="copy">
      <div class="eyebrow"><span class="dot"></span>Your tagline eyebrow</div>
      <h1>Short punchy,<br /><span class="hl">headline here</span></h1>
      <div class="sub">A slightly longer value sentence that supports the headline for search-result viewers.</div>
      <div class="pills">
        <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Feature one</span>
        <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Feature two</span>
        <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Feature three</span>
      </div>
    </div>
    <div class="hero">
      <div class="glow"></div>
      <div class="shot"></div>
      <div class="badge"><img src="logo.png" alt="logo" /></div>
    </div>
  </div>
</body>
</html>
