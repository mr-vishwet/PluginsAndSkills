<!DOCTYPE html>
<!-- iOS Header Asset. Author at 2622x1475, render 2x -> resample to 5244x2950 (or 3840x1646).
     SAFE ZONE: the App Store info card overlaps the bottom ~45% and iPhone crops to the center width,
     so keep the icon + copy as a horizontally-centered group in the UPPER band. Place logo.png next to this file. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    /* ==== EDIT to the target app's theme ==== */
    --brand:#705BE4; --brand-dark:#5A46C7; --accent1:#9B67F9; --accent2:#FC5F4A;
    --ink:#23204B; --muted:#5B6072; --bg1:#FBFAFF; --bg2:#F1EEFC; --bg3:#EAE4F9;
    --serif:'Playfair Display',Georgia,serif; --sans:'Inter',-apple-system,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:2622px;height:1475px;overflow:hidden;}
  body{font-family:var(--sans);position:relative;-webkit-font-smoothing:antialiased;color:var(--ink);
    background:
      radial-gradient(1750px 1250px at 50% 28%, rgba(155,103,249,.20) 0%, rgba(155,103,249,0) 62%),
      radial-gradient(1350px 1000px at 6% 96%, rgba(112,91,228,.12) 0%, rgba(112,91,228,0) 60%),
      radial-gradient(1350px 1000px at 94% 96%, rgba(252,95,74,.10) 0%, rgba(252,95,74,0) 60%),
      linear-gradient(120deg,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%);}
  .shot{position:absolute;z-index:0;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-6deg);
    width:720px;height:1200px;border-radius:92px;overflow:hidden;background-color:#fff;opacity:.07;
    background-image:url('screenshot.jpg');background-repeat:no-repeat;background-size:250% auto;background-position:50% 56%;
    -webkit-mask-image:radial-gradient(58% 52% at 50% 50%,#000 40%,transparent 80%);
            mask-image:radial-gradient(58% 52% at 50% 50%,#000 40%,transparent 80%);}
  .spot{position:absolute;z-index:1;left:50%;top:38%;transform:translate(-50%,-50%);width:2050px;height:900px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,255,255,.72) 0%,rgba(255,255,255,.35) 55%,rgba(255,255,255,0) 78%);filter:blur(6px);}
  /* centered group in the upper band */
  .center{position:absolute;z-index:2;left:0;right:0;top:0;height:1150px;display:flex;flex-direction:row;
    align-items:center;justify-content:center;gap:84px;padding:0 200px;}
  .badge{flex:0 0 auto;width:250px;height:250px;border-radius:58px;overflow:hidden;position:relative;border:6px solid rgba(255,255,255,.9);
    box-shadow:0 30px 64px rgba(60,40,140,.30),0 10px 24px rgba(60,40,140,.20);}
  .badge img{width:100%;height:100%;object-fit:cover;display:block;}
  .text{display:flex;flex-direction:column;align-items:flex-start;text-align:left;}
  .eyebrow{display:inline-flex;align-items:center;gap:14px;font-size:25px;font-weight:700;letter-spacing:4.5px;
    text-transform:uppercase;color:var(--brand-dark);margin-bottom:18px;}
  .eyebrow .dot{width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,var(--accent1),var(--accent2));}
  h1{font-family:var(--serif);font-weight:800;color:var(--ink);font-size:92px;line-height:1.06;letter-spacing:-1.5px;}
  h1 .hl{background:linear-gradient(120deg,var(--accent1),var(--brand) 55%,var(--accent2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{margin-top:20px;font-size:34px;line-height:1.3;color:var(--muted);}
  .pills{display:flex;gap:20px;margin-top:30px;}
  .pill{display:inline-flex;align-items:center;gap:14px;padding:18px 32px;border-radius:999px;font-size:28px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.88);border:3px solid rgba(112,91,228,.24);box-shadow:0 10px 26px rgba(90,70,199,.10);}
  .pill svg{width:30px;height:30px;}
</style>
</head>
<body>
  <div class="shot"></div>
  <div class="spot"></div>
  <div class="center">
    <div class="badge"><img src="logo.png" alt="logo" /></div>
    <div class="text">
      <div class="eyebrow"><span class="dot"></span>Your tagline eyebrow</div>
      <h1>Short punchy<br /><span class="hl">headline here</span></h1>
      <div class="sub">One crisp value line for the app.</div>
      <div class="pills">
        <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Feature one</span>
        <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Feature two</span>
        <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Feature three</span>
      </div>
    </div>
  </div>
</body>
</html>
